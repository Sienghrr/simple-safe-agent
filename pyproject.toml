[tool.poetry]
name = "student-assistant-agent"
version = "0.1.0"
description = "A simple agentic Student Assistant that searches courses, checks schedules, and registers courses."
authors = ["Student <sienglydong@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
openai = "^1.30"
pydantic = "^2.7"
python-dotenv = "^1.2.3"

[tool.poetry.scripts]
student-agent = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
